# Generates an animated SVG of a "snake" eating your contribution graph.
#
# SETUP:
# 1. Put this file at: .github/workflows/snake.yml
# 2. This workflow is intended for the special repository:
#    "sufiyan34/sufiyan34"
# 3. Commit and push to your default branch.
# 4. The workflow runs automatically once a day and on pushes to main.
# 5. It publishes the generated SVGs to a branch called "output".
#
# README image:
# https://raw.githubusercontent.com/sufiyan34/sufiyan34/output/github-contribution-grid-snake-dark.svg
#
# GITHUB_TOKEN is provided automatically by GitHub Actions.

name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
